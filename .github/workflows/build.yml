
name: Build AIPlayersPaper

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build plugin
        working-directory: AIPlayersPaper
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AIPlayersPaper-JAR
          path: AIPlayersPaper/build/libs/*.jar
          if-no-files-found: error
